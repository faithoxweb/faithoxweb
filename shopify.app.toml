# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2fab3cb6a774769f418c08f1e7c9de16"
name = "Faithox"
application_url = "https://faithox.com/api/auth"
embedded = true
 
[webhooks]
api_version = "2026-07"

  # This is the "one-click" setup pointing to your Vercel endpoint
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://faithox.com/api/webhooks/shopify"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
# Added both www and non-www to prevent OAuth installation errors
redirect_urls = [ 
  "https://faithox.com/api/auth/callback",
  "https://www.faithox.com/api/auth/callback" 
]
