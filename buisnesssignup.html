<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faithox | Partner With Us</title>
    <link rel="icon" href="https://fdjcvpsqossuiljuadkk.supabase.co/storage/v1/object/public/website%20images/my-logo.png" sizes="any" type="image/png">    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        html, body { max-width: 100%; overflow-x: hidden; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            width: 100%;
            overflow: hidden; 
            color: #111827; 
            -webkit-font-smoothing: antialiased;
            background: #f0f1f1;
        }

        .page-wrapper {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .auth-side-anim {
            flex: 0 0 50%;
            width: 50%;
            background: #f0f1f1;
            position: relative;
        }

        .auth-side-form {
            flex: 0 0 50%;
            width: 50%;
            background: #fdfdfd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .form-container {
            width: 100%;
            max-width: 380px; 
            padding: 40px 24px;
            text-align: center;
            position: relative;
        }

        .logo-container {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: contain;
        }

        h2 { 
            font-size: 22px; 
            font-weight: 700; 
            color: #111827; 
            margin-bottom: 8px; 
            letter-spacing: -0.3px;
        }

        p.sub-text { 
            font-size: 15px; 
            color: #6b7280; 
            font-weight: 400; 
            margin-bottom: 32px; 
        }

        .message-box {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .message-box.show { display: block; }
        .message-box.error { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; }
        .message-box.success { background: #f0fdf4; color: #22c55e; border: 1px solid #bbf7d0; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: none; }
        
        .auth-input { 
            width: 100%; 
            padding: 12px 16px; 
            background: #f0f1f1;
            border: 1px solid transparent;
            border-radius: 12px; 
            font-size: 14px; 
            transition: all 0.2s ease; 
            font-weight: 400; 
            color: #111827; 
        }
        .auth-input::placeholder { color: #9ca3af; }

        .primary-btn { 
            width: 100%; 
            padding: 12px 16px; 
            background: #2a2a2a; 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            font-weight: 500; 
            font-size: 14px; 
            cursor: pointer; 
            margin-bottom: 24px;
            transition: all 0.3s ease; 
        }
        .primary-btn:hover { background: #d0c9f8; }

        .social-group {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            transition: 0.2s;
        }
        .social-btn:hover { background: #f3f4f6; }
        .social-btn img { width: 16px; height: 16px; }

        .form-footer {
            font-size: 13px;
            color: #6b7280;
        }
        .form-footer span { 
            color: #3b82f6; 
            cursor: pointer; 
            font-weight: 500; 
        }
        .form-footer span:hover { text-decoration: underline; }

        .nprogress-bar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 0%; 
            height: 4px; 
            background: #111827; 
            z-index: 9999999; 
            pointer-events: none; 
            opacity: 0; 
        }

        @media (max-width: 768px) {
            body { overflow-y: auto; overflow-x: hidden; background: #fdfdfd; }
            .page-wrapper { display: block; height: auto; min-height: 100vh; }
            .auth-side-anim { display: none; }
            .auth-side-form { width: 100%; min-height: 100vh; height: auto; flex: none; }
            .form-container { padding: 40px 24px; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <div id="pro-progress-bar" class="nprogress-bar"></div>

    <div class="page-wrapper">
        <div class="auth-side-anim">
            <!-- Left Side Area -->
        </div>

        <div class="auth-side-form">
            <div class="form-container">

                <div class="logo-container">
                    <img src="https://fdjcvpsqossuiljuadkk.supabase.co/storage/v1/object/public/website%20images/my-logo.png" alt="Logo">
                </div>

                <h2 id="page-title">Sign up to Faithox Buisness</h2>
                <p class="sub-text" id="page-subtext">Manage your reviews with buisness account.</p>
                
                <div id="form-message" class="message-box"></div>

                <div id="signup-step-1">
                    <div class="input-group">
                        <input type="email" id="email-up" class="auth-input" placeholder="Email address">
                    </div>
                    <button class="primary-btn" onclick="sendOtp()">Continue with email</button>
                    
                    <div class="social-group">
                        <button class="social-btn" onclick="alert('Social login coming soon!')">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google
                        </button>
                        <button class="social-btn" onclick="alert('Social login coming soon!')">
                            <img src="https://www.svgrepo.com/show/512317/github-142.svg" alt="GitHub"> GitHub
                        </button>
                    </div>
                </div>

                <div id="signup-step-2" style="display: none;">
                    <div class="input-group">
                        <input type="text" id="otp-up" class="auth-input" placeholder="6-digit code">
                    </div>
                    <button class="primary-btn" onclick="verifyOtp()">Verify Email</button>
                    <p style="font-size: 13px; text-align: center; margin-bottom: 32px;">
                        <a href="javascript:void(0)" onclick="resetView()" style="color: #6b7280; text-decoration: underline;">Change Email</a>
                    </p>
                </div>

                <div id="signup-step-3" style="display: none;">
                    <div class="input-group">
                        <input type="text" id="company-domain-up" class="auth-input" placeholder="e.g., yourcompany.com">
                    </div>
                    <button class="primary-btn" onclick="completeSignup()">Create Business Account</button>
                </div>

                <div class="form-footer">
                    Already have an account? <span onclick="navigateTo('buisnesslogin.html')">Login</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        let progressInterval;
        window.navigateTo = (url) => {
            const bar = document.getElementById('pro-progress-bar');
            if (!bar) { window.location.href = url; return; }

            clearInterval(progressInterval);
            bar.style.transition = 'none';
            bar.style.opacity = '1';
            bar.style.width = '0%';
            void bar.offsetWidth; 

            bar.style.transition = 'width 0.2s ease-out';
            let currentWidth = Math.random() * 15 + 15; 
            bar.style.width = currentWidth + '%';

            progressInterval = setInterval(() => {
                currentWidth += Math.random() * 5 + 2; 
                if (currentWidth > 85) currentWidth = 85; 
                bar.style.transition = 'width 0.2s ease';
                bar.style.width = currentWidth + '%';
            }, 200);

            setTimeout(() => {
                clearInterval(progressInterval);
                bar.style.transition = 'width 0.15s ease-out'; 
                bar.style.width = '100%';
                
                setTimeout(() => {
                    window.location.href = url;
                }, 150);
            }, 300); 
        };

        window.addEventListener('pageshow', function(event) {
            const bar = document.getElementById('pro-progress-bar');
            if (bar) {
                clearInterval(progressInterval);
                bar.style.transition = 'none';
                bar.style.opacity = '0';
                bar.style.width = '0%';
            }
        });

        const SUPABASE_URL = 'https://fdjcvpsqossuiljuadkk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkamN2cHNxb3NzdWlsanVhZGtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2MDI5ODYsImV4cCI6MjA4NjE3ODk4Nn0.z2ZutYZi_oLr_wYq6LufLyU3bI3XbRuA33JD8iA5Q6o';
        
        let db;
        try { db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } 
        catch (e) { console.error("Supabase failed to init:", e); }

        let currentEmail = "";

        function showMessage(text, type) {
            const msgBox = document.getElementById('form-message');
            msgBox.innerText = text;
            msgBox.className = `message-box ${type} show`;
        }

        function clearMessage() {
            const msgBox = document.getElementById('form-message');
            msgBox.className = 'message-box';
            msgBox.innerText = '';
        }

        function resetView() {
            document.getElementById('signup-step-1').style.display = 'block';
            document.getElementById('signup-step-2').style.display = 'none';
            document.getElementById('signup-step-3').style.display = 'none';
        }

        window.onload = async () => {
            if (db) {
                const { data } = await db.auth.getSession();
                if (data.session) {
                    const userRole = data.session.user.user_metadata?.role || 'customer';
                    if (userRole === 'business') {
                        window.location.replace('dashboard.html');
                    } else {
                        window.location.replace('index.html');
                    }
                }
            }
        };

        async function sendOtp() {
            if (!db) return;
            clearMessage();
            
            currentEmail = document.getElementById('email-up').value.trim();
            if (!currentEmail) {
                showMessage("Please enter your email!", "error");
                return;
            }

            const { error } = await db.auth.signInWithOtp({
                email: currentEmail,
                options: { shouldCreateUser: true }
            });

            if (error) {
                showMessage("Failed to send OTP: " + error.message, "error");
            } else {
                showMessage("Code sent to your email!", "success");
                document.getElementById('signup-step-1').style.display = 'none';
                document.getElementById('signup-step-2').style.display = 'block';
            }
        }

        async function verifyOtp() {
            clearMessage();
            const token = document.getElementById('otp-up').value.trim();

            if (!token) {
                showMessage("Please enter the OTP!", "error");
                return;
            }

            const { data, error } = await db.auth.verifyOtp({
                email: currentEmail,
                token: token,
                type: 'email'
            });

            if (error) {
                showMessage("Invalid OTP: " + error.message, "error");
            } else if (data.session) {
                const storedRole = data.user.user_metadata?.role;

                if (storedRole === 'business') {
                    showMessage("Email verified! Redirecting...", "success");
                    setTimeout(() => navigateTo('dashboard.html'), 1500);
                } else if (storedRole === 'customer') {
                    await db.auth.signOut();
                    showMessage("Access Denied: Email registered as a Customer. Use a different email.", "error");
                    return;
                } else {
                    document.getElementById('signup-step-2').style.display = 'none';
                    document.getElementById('signup-step-3').style.display = 'block';
                    showMessage("Email verified! Please enter business domain.", "success");
                }
            }
        }

        async function completeSignup() {
            clearMessage();
            
            let domainValue = document.getElementById('company-domain-up').value.trim().toLowerCase();

            if (!domainValue) {
                showMessage("Please fill in your business domain!", "error");
                return;
            }

            const domainRegex = /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/;
            if (!domainRegex.test(domainValue)) {
                showMessage("Please type domain of business and not the name", "error");
                return;
            }

            let cleanDomain = domainValue.replace(/^www\./i, '');
            let domainNameOnly = cleanDomain.split('.')[0]; 
            let randomDigits = Math.floor(1000 + Math.random() * 9000);
            let generatedStoreId = domainNameOnly + randomDigits;

            const { error: authError } = await db.auth.updateUser({
                data: {
                    full_name: domainValue, 
                    store_id: generatedStoreId, 
                    role: 'business'        
                }
            });

            if (authError) {
                showMessage("Failed to set up account: " + authError.message, "error");
                return;
            }

            const { error: dbError } = await db.from('stores').insert([{
                store_id: generatedStoreId,
                email: currentEmail,
                domain_name: domainValue
            }]);

            if (dbError) {
                showMessage("Failed to save to database: " + dbError.message, "error");
                return;
            }

            showMessage("Business Account setup complete! Redirecting...", "success");
            setTimeout(() => navigateTo('dashboard.html'), 1500);
        }
    </script>
</body>
</html>
